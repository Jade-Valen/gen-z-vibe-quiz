<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Check 🎀</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e8,#e4ddff);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#30283d;
}

.card{
width:100%;
max-width:450px;
background:rgba(255,255,255,.9);
border-radius:28px;
padding:28px 20px;
text-align:center;
box-shadow:0 15px 40px rgba(60,40,80,.18);
}

h1{font-size:28px;margin:10px 0}
p{line-height:1.5}

button{
border:0;
border-radius:22px;
padding:13px 18px;
margin:7px;
font-size:15px;
background:#30283d;
color:white;
cursor:pointer;
}

.option{
display:block;
width:100%;
text-align:left;
background:white;
color:#30283d;
border:1px solid #e4dcec;
}

input{
width:90%;
padding:13px;
border-radius:18px;
border:1px solid #ddd;
font-size:16px;
text-align:center;
}

.emoji{font-size:55px}

.fact{
background:#fff0f7;
padding:16px;
border-radius:20px;
margin:18px 0;
}
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>
const app=document.getElementById("app");
let name="";

function start(){
app.innerHTML=`
<div class="emoji">🎀</div>
<h1>Vibe Check ✨</h1>
<p>Welcome to the most scientifically questionable quiz on the internet.</p>
<p><b>Are you ready?</b></p>
<button onclick="namePage()">YES 😭</button>
<button onclick="namePage()">Obviously 😌</button>
`;
}

function namePage(){
app.innerHTML=`
<div class="emoji">🏷️</div>
<h1>First things first...</h1>
<p>What should I call you?</p>
<input id="n" maxlength="20" placeholder="Your nickname">
<br>
<button onclick="saveName()">That's me ✨</button>
`;
}

function saveName(){
name=document.getElementById("n").value.trim();
if(!name){
alert("Give me a nickname first 😭");
return;
}
q1();
}

function q1(){
app.innerHTML=`
<div class="emoji">🧠</div>
<h1>${name}, brain status?</h1>
<button class="option" onclick="q2('Loading... 🧠')">🧠 Loading...</button>
<button class="option" onclick="q2('Absolutely cooked 🫠')">🫠 Absolutely cooked</button>
<button class="option" onclick="q2('Surprisingly functional ✨')">✨ Surprisingly functional</button>
<button class="option" onclick="q2('No thoughts, just vibes 🐒')">🐒 No thoughts, just vibes</button>
`;
}

function q2(brain){
app.innerHTML=`
<div class="emoji">🔋</div>
<h1>Current battery?</h1>
<button class="option" onclick="q3('${brain}','1–10% 🥔')">🥔 1–10% — basically a potato</button>
<button class="option" onclick="q3('${brain}','11–30% 😭')">😭 11–30% — surviving</button>
<button class="option" onclick="q3('${brain}','31–60% 😌')">😌 31–60% — we're okay</button>
<button class="option" onclick="q3('${brain}','61–100% ⚡')">⚡ 61–100% — unstoppable</button>
`;
}

function q3(brain,battery){
app.innerHTML=`
<div class="emoji">🚩</div>
<h1>Pick your red flag.</h1>
<button class="option" onclick="q4('${brain}','${battery}','Replying later and disappearing 📱')">📱 Replying later and disappearing</button>
<button class="option" onclick="q4('${brain}','${battery}','Studying one day before the exam 📚')">📚 Studying one day before the exam</button>
<button class="option" onclick="q4('${brain}','${battery}','Five more minutes = 45 minutes 🛏️')">🛏️ Five more minutes = 45 minutes</button>
<button class="option" onclick="q4('${brain}','${battery}','Adding everything to my cart 🛒')">🛒 Adding everything to my cart</button>
`;
}

function q4(brain,battery,flag){
app.innerHTML=`
<div class="emoji">🎌</div>
<h1>Anime energy?</h1>
<button class="option" onclick="q5('${brain}','${battery}','${flag}','Main character ⚔️')">⚔️ Main character</button>
<button class="option" onclick="q5('${brain}','${battery}','${flag}','Mysterious villain 🖤')">🖤 Mysterious villain</button>
<button class="option" onclick="q5('${brain}','${battery}','${flag}','Comic relief 🤣')">🤣 Comic relief</button>
<button class="option" onclick="q5('${brain}','${battery}','${flag}','Overpowered side character 👑')">👑 Overpowered side character</button>
`;
}

function q5(brain,battery,flag,anime){
const facts=[
"🐙 Octopuses have three hearts.",
"🦩 A group of flamingos is called a flamboyance.",
"🐧 Penguins sometimes give pebbles as gifts.",
"🦋 Butterflies taste using sensors on their feet.",
"🦈 Sharks existed before trees."
];

const fact=facts[Math.floor(Math.random()*facts.length)];

app.innerHTML=`
<div class="emoji">🎲</div>
<h1>Random useless knowledge</h1>
<div class="fact">${fact}</div>
<p>Okay ${name}, one final vibe check.</p>
<button onclick="result('${brain}','${battery}','${flag}','${anime}')">Show my results ✨</button>
`;
}

function result(brain,battery,flag,anime){
app.innerHTML=`
<div class="emoji">✨</div>
<h1>${name}'s Vibe Report</h1>

<p>🧠 <b>Brain:</b> ${brain}</p>
<p>🔋 <b>Battery:</b> ${battery}</p>
<p>🚩 <b>Red flag:</b> ${flag}</p>
<p>🎌 <b>Anime energy:</b> ${anime}</p>

<div class="fact">
<b>Official diagnosis:</b><br><br>
You are approximately 87% vibes, 10% chaos and 3% pretending to know what's going on. 😭
</div>

<button onclick="feedback()">Continue → 💌</button>
`;
}

function feedback(){
app.innerHTML=`
<div class="emoji">💌</div>
<h1>Be honest...</h1>
<p>How was the quiz?</p>

<button class="option" onclick="thanks('Loved it 💗')">💗 Loved it</button>
<button class="option" onclick="thanks('It was cute 🎀')">🎀 It was cute</button>
<button class="option" onclick="thanks('Chaotic but fun 😭')">😭 Chaotic but fun</button>
<button class="option" onclick="thanks('It was okay 😐')">😐 It was okay</button>
`;
}

function thanks(answer){
app.innerHTML=`
<div class="emoji">🎀</div>
<h1>${answer}</h1>
<p>Thanks for playing, ${name}! ✨</p>
<p>Come back whenever you're bored.</p>
<button onclick="start()">🔄 Play again</button>
`;
}

start();
</script>

</body>
</html>
